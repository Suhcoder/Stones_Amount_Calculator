<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stones Amount Tracker</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          text-align: center;
      }
      table {
          width: 100%;
          border-collapse: collapse;
          margin: 20px auto;
      }
      th, td {
          border: 1px solid #000;
          padding: 8px;
          text-align: center;
      }
      th {
          background-color: #f4f4f4;
      }
      /* Column background colors */
      .stone1-col, .amount1-col {
          background-color: #DFF2BF; /* Light green */
      }
      .stone2-col, .amount2-col {
          background-color: #FFBABA; /* Light red */
      }
      .notes {
          background-color: #f0f0f0; /* Neutral gray */
      }
      /* Buttons */
      .csv-btn, .add-row-btn {
          margin: 10px;
          padding: 8px 16px;
          font-size: 16px;
          cursor: pointer;
          background-color: #007bff;
          color: white;
          border: none;
          border-radius: 5px;
      }
      /* Column widths */
      .wide-column {
          width: 10%;
      }
      .day-column {
          width: 15%;
      }
      .stone1-col, .amount1-col, .stone2-col, .amount2-col {
          width: 15%;
      }
      .notes {
          width: 25%;
      }
      .total-align {
          text-align: left;
          padding-left: 10px;
      }
      /* Numeric inputs */
      input[type="number"] {
          width: 80px;
      }
  </style>
</head>
<body>
  <h2>Stones Amount Tracker</h2>
  <!-- Removed inline onclick; we will add a JS event listener instead -->
  <button class="csv-btn" type="button">Export CSV</button>
  <button class="add-row-btn" type="button">Add Row</button>

  <table id="dataTable">
    <thead>
      <tr>
        <th class="wide-column">Date</th>
        <th class="day-column">Day</th>
        <th class="stone1-col">Kadaliparamba</th>
        <th class="amount1-col">Amount 1</th>
        <th class="notes">Notes</th>
        <th class="stone2-col">Nerappu</th>
        <th class="amount2-col">Amount 2</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <!-- 1) Date Picker (Auto-fill Day) -->
        <td class="wide-column">
          <input type="date" required pattern="\d{4}-\d{2}-\d{2}" onchange="updateDay(this)">
        </td>
        <!-- 2) Day (read-only, auto-updates on date pick) -->
        <td class="day-column">
          <input type="text" readonly>
        </td>
        <!-- 3) Kadaliparamba numeric input -->
        <td class="stone1-col">
          <input type="number" oninput="calculateAmounts()" min="0">
        </td>
        <!-- 4) Amount 1 auto-calc -->
        <td class="amount1-col">
          <input type="text" readonly>
        </td>
        <!-- 5) Notes -->
        <td class="notes">
          <input type="text">
        </td>
        <!-- 6) Nerappu numeric input -->
        <td class="stone2-col">
          <input type="number" oninput="calculateAmounts()" min="0">
        </td>
        <!-- 7) Amount 2 auto-calc -->
        <td class="amount2-col">
          <input type="text" readonly>
        </td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <!-- 7 columns to match header -->
        <th class="total-align">Total</th>
        <th></th>
        <th id="totalKadaliparamba" class="stone1-col">0</th>
        <th id="totalAmount1" class="amount1-col">0</th>
        <th id="finalNotes">Final Notes</th>
        <th id="totalNerappu" class="stone2-col">0</th>
        <th id="totalAmount2" class="amount2-col">0</th>
      </tr>
    </tfoot>
  </table>

  <script>
    // Auto-fill the "Day" cell when a date is picked
    function updateDay(input) {
      let dateVal = input.value;
      if (dateVal) {
        let date = new Date(dateVal + 'T00:00:00');
        let day = date.toLocaleDateString('en-US', { weekday: 'long' });
        let dayInput = input.parentElement.parentElement.querySelector('.day-column input');
        dayInput.value = day;
      } else {
        let dayInput = input.parentElement.parentElement.querySelector('.day-column input');
        dayInput.value = '';
      }
      calculateAmounts();
    }

    // Recalculate amounts & update totals
    function calculateAmounts() {
      let rows = document.querySelectorAll("#dataTable tbody tr");
      let totalKadaliparamba = 0;
      let totalAmount1 = 0;
      let totalNerappu = 0;
      let totalAmount2 = 0;

      rows.forEach(row => {
        let kadaliparambaVal = parseFloat(row.querySelector('.stone1-col input').value) || 0;
        let nerappuVal = parseFloat(row.querySelector('.stone2-col input').value) || 0;
        let amount1Val = kadaliparambaVal * 13;
        let amount2Val = nerappuVal * 9;

        row.querySelector('.amount1-col input').value = amount1Val.toFixed(2);
        row.querySelector('.amount2-col input').value = amount2Val.toFixed(2);

        totalKadaliparamba += kadaliparambaVal;
        totalAmount1 += amount1Val;
        totalNerappu += nerappuVal;
        totalAmount2 += amount2Val;
      });

      document.getElementById('totalKadaliparamba').textContent = totalKadaliparamba.toFixed(2);
      document.getElementById('totalAmount1').textContent = totalAmount1.toFixed(2);
      document.getElementById('totalNerappu').textContent = totalNerappu.toFixed(2);
      document.getElementById('totalAmount2').textContent = totalAmount2.toFixed(2);
    }

    // Dynamically add a new row (with background colors & day auto-fill)
    function addRow() {
      let tableBody = document.querySelector("#dataTable tbody");
      let newRow = document.createElement('tr');
      newRow.innerHTML = `
        <td class="wide-column">
          <input type="date" required pattern="\\d{4}-\\d{2}-\\d{2}" onchange="updateDay(this)">
        </td>
        <td class="day-column">
          <input type="text" readonly>
        </td>
        <td class="stone1-col">
          <input type="number" oninput="calculateAmounts()" min="0">
        </td>
        <td class="amount1-col">
          <input type="text" readonly>
        </td>
        <td class="notes">
          <input type="text">
        </td>
        <td class="stone2-col">
          <input type="number" oninput="calculateAmounts()" min="0">
        </td>
        <td class="amount2-col">
          <input type="text" readonly>
        </td>
      `;
      tableBody.appendChild(newRow);
    }

    // Format today's date as DD-MM-YY for CSV file naming
    function getFormattedDate() {
      let today = new Date();
      let dd = String(today.getDate()).padStart(2, '0');
      let mm = String(today.getMonth() + 1).padStart(2, '0');
      let yy = String(today.getFullYear()).slice(-2);
      return `${dd}-${mm}-${yy}`;
    }

    // Export entire table as a single CSV
    function exportCSV() {
      let table = document.getElementById("dataTable");
      let rows = table.querySelectorAll("tr");
      let csv = [];

      for (let i = 0; i < rows.length; i++) {
        let cols = rows[i].querySelectorAll("td, th");
        let rowData = [];
        cols.forEach(col => {
          let input = col.querySelector("input");
          let val = input ? input.value.replace(/,/g, '') : col.innerText.trim();
          rowData.push(val);
        });
        csv.push(rowData.join(","));
      }

      let csvContent = "data:text/csv;charset=utf-8," + csv.join("\n");
      let link = document.createElement("a");
      link.setAttribute("href", encodeURI(csvContent));
      link.setAttribute("download", `Stones_Combined_${getFormattedDate()}.csv`);
      link.click();
    }

    // Add event listeners to avoid double triggers
    document.querySelector(".csv-btn").addEventListener("click", function(e) {
      e.preventDefault();
      exportCSV();
    });
    document.querySelector(".add-row-btn").addEventListener("click", function(e) {
      e.preventDefault();
      addRow();
    });
  </script>
</body>
</html>
